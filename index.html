<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2NL9YG6X41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2NL9YG6X41');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fris's Blog</title>
    
    <!-- Added Favicon to prevent 404 requests -->
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; font-family: 'Noto Sans SC', sans-serif; color: white; overflow-x: hidden; }
        #bg-fixed { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); z-index: -1; }
        #location-tag { position: fixed; right: 30px; bottom: 30px; font-size: 0.85rem; color: rgba(255,255,255,0.7); z-index: 9999; letter-spacing: 1px; opacity: 0; transition: opacity 1s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .squircle { border-radius: 48px; }
        .blog-section { width: 90%; max-width: 800px; margin: 0 auto; padding-bottom: 100px; position: relative; z-index: 1; }
        .glass-panel { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .post-card { display: block; text-decoration: none; color: inherit; padding: 30px; margin-bottom: 25px; transition: 0.3s; }
        .post-card:hover { transform: scale(1.02); background: rgba(255, 255, 255, 0.12); }
        #detail-view { display: none; padding-top: 60px; min-height: 100vh; }
        .detail-card { padding: 45px; margin-top: 20px; }

        /* --- 换行精准修复样式 --- */
        .markdown-body { 
            line-height: 1.8; 
            color: rgba(255, 255, 255, 0.9); 
            white-space: pre-wrap; /* 核心：完全根据编辑器内的换行和缩进进行前台显示 */
            word-wrap: break-word;
        }
        
        /* 恢复被全局 margin: 0 清除的 Markdown 基础排版间距 */
        .markdown-body p { margin-bottom: 1.2em; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin-top: 1.5em; margin-bottom: 0.8em; }
        .markdown-body blockquote { margin: 1.2em 0; padding-left: 1em; border-left: 4px solid #444; color: #aaa; }
        .appendix-box *:last-child { margin-bottom: 0 !important; } /* 消除附加内容最后一行多余的底边距，以便完美居中 */
        
        /* 列表修复 */
        .markdown-body ul, .markdown-body ol {
            white-space: normal; /* 解决 list 内容与上下空2行的问题 */
            list-style-position: inside; /* 让左边的点与普通文本保持同样缩进 */
            padding-left: 0;
            margin-top: 0em; /* 减小普通句子和列表的距离 */
            margin-bottom: 0.5em;
        }
        .markdown-body li {
            white-space: normal;
            margin-bottom: 0.3em;
        }

        /* 排除代码块中的样式干扰，确保代码块显示正常 */
        .markdown-body pre { 
            background: rgba(0, 0, 0, 0.2) !important; /* 调整比较突兀的黑色背景 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px !important; 
            border-radius: 48px !important; /* 统一的超圆角效果 */
            margin: 25px 0 !important; 
            position: relative !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            overflow-x: auto !important;
            white-space: pre !important; /* 代码块内不换行 */
        }
        
        /* 行内代码样式修复，保留特殊字体，去掉框，提亮颜色 */
        .markdown-body code { 
            font-family: 'Consolas', 'Monaco', monospace !important; 
            font-size: 0.95rem !important; 
            background: transparent !important; 
            padding: 0 !important;
            border: none !important;
            color: #ffcc00 !important; /* 提高亮度，改为亮黄色方便分辨 */
            display: inline-block !important; /* 整体不断开，如果太长换到下一行 */
            white-space: pre-wrap !important; 
            word-break: break-all !important; 
            vertical-align: baseline;
        }
        .markdown-body pre code { 
            display: block !important;
            white-space: pre !important; 
            word-break: normal !important; 
            overflow-x: visible;
        }

        .markdown-body a { color: inherit !important; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.3); transition: border-color 0.3s; }
        .markdown-body a:hover { border-bottom-color: rgba(255, 255, 255, 0.8); }
        .copy-btn { position: absolute; top: 12px; right: 12px; padding: 5px 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; cursor: pointer; font-size: 11px; opacity: 0; transition: 0.2s; z-index: 100; }
        .markdown-body pre:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: #fff; color: #000; }
        .back-btn { cursor:pointer; margin-bottom:20px; opacity:0.6; display:inline-flex; align-items: center; color: white; text-decoration: none; transition: 0.3s; }
        #typewriter { margin-top:15px; opacity:0.5; font-weight:300; min-height: 1.2em; white-space: pre-wrap; word-break: break-word; text-align: center; position: relative; }
        #typewriter .source { position: absolute; top: 100%; left: 0; right: 0; display: block; font-size: 0.8em; font-family: 'Playfair Display', serif; font-style: italic; margin-top: 10px; opacity: 0.8; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="bg-fixed"></div>
    <div class="overlay"></div>
    <div id="location-tag"></div> 

    <div id="list-ui">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4.5rem); cursor: pointer;" onclick="location.href='/'">Fris's Page</h1>
            <div id="typewriter"></div>
        </section>
        <main class="blog-section" id="post-list"></main>
    </div>

    <div id="detail-view" class="blog-section">
        <a href="/" class="back-btn" id="final-back-link">← Back</a>
        <div class="detail-card glass-panel squircle">
            <div id="detail-content" class="markdown-body"></div>
        </div>
    </div>

    <script>
        const locationData = { pc: { "1": "京都　龍安寺", "2": "関西", "3": "忍野八海", "4": "渋谷", "5": "東京都庁", "6": "广州孙中山纪念堂", "7": "皇居", "8": "大手町", "9": "東京駅", "10": "大阪", "11": "心斎橋", "12": "甲子園", "13": "Bangkok", "14": "Bangkok", "15": "明治神宫", "16": "京都御苑", "17": "京都御苑", "18": "東京都庁", "19": "新宿", "20": "增上寺", "21": "日本桥", "22": "東京都庁", "23": "新宿御苑", "24": "新宿御苑", "25": "富士山" }, mobile: { "1": "富士山", "2": "東京タワー", "3": "東京タワー", "4": "日本桥" } };

        function initScene() {
            const bg = document.getElementById('bg-fixed');
            const tag = document.getElementById('location-tag');
            const isMobile = window.innerWidth <= 768;
            const type = isMobile ? 'mobile' : 'pc';
            const count = isMobile ? 4 : 25;
            const num = Math.floor(Math.random() * count) + 1;
            const src = `images/${type}/${num}.webp`;
            const img = new Image();
            img.src = src;
            img.onload = () => {
                bg.style.backgroundImage = `url('${src}')`;
                bg.style.opacity = '1';
                if (locationData[type][num]) {
                    tag.innerText = locationData[type][num];
                    tag.style.opacity = '1';
                }
            };
        }

        async function runTypewriter() {
            const el = document.getElementById('typewriter');
            let contentText = "personal website started in 2023";
            let sourceText = "";
            
            try {
                const res = await fetch('/posts?type=subtitles');
                if (res.ok) {
                    const subtitles = await res.json();
                    if (subtitles && subtitles.length > 0) {
                        const randomSub = subtitles[Math.floor(Math.random() * subtitles.length)];
                        contentText = randomSub.content || '';
                        sourceText = randomSub.source || '';
                    }
                }
            } catch (e) { console.error('Failed to load subtitles', e); }

            let i = 0; el.innerHTML = ""; 
            function type() { 
                if (i < contentText.length) { 
                    // Handle newlines in content if any
                    if (contentText.charAt(i) === '\n') {
                        el.innerHTML += '<br>';
                    } else {
                        el.innerHTML += contentText.charAt(i); 
                    }
                    i++; 
                    setTimeout(type, 40); 
                } else if (sourceText) {
                    setTimeout(() => {
                        el.innerHTML += `<span class="source">— ${sourceText}</span>`;
                    }, 200);
                }
            }
            type();
        }

        async function fetchPosts() {
            try {
                const res = await fetch('/posts');
                const posts = await res.json();
                document.getElementById('post-list').innerHTML = posts.map(p => `
                    <a href="?id=${p.id}" class="post-card glass-panel squircle" onclick="event.preventDefault(); loadArticle(${p.id})">
                        <h2>${p.title}</h2>
                        <div style="margin-top:10px; font-size:0.8rem; opacity:0.3;">${p.date || ''}</div>
                    </a>
                `).join('');
            } catch (e) { console.error("Fetch error:", e); }
        }

        // 配置 Marked 解析器
        marked.setOptions({
            breaks: true, // 允许单行换行
            gfm: true
        });

        // 预处理 Markdown：保护多余的空行，将其转换为可见的空段落
        function preserveEmptyLines(text) {
            if (!text) return '';
            let blocks = text.split(/(```[\s\S]*?```)/);
            for (let i = 0; i < blocks.length; i++) {
                if (i % 2 === 0) {
                    // 兼容 Windows(\r\n) 和包含空格的空行
                    blocks[i] = blocks[i].replace(/(?:\r?\n[ \t]*){3,}/g, match => {
                        const count = match.match(/\n/g).length;
                        return '\n\n' + '&nbsp;\n\n'.repeat(count - 2);
                    });
                }
            }
            return blocks.join('');
        }

        async function loadArticle(id, pushState = true) {
            try {
                const res = await fetch(`/posts?id=${id}`);
                const post = await res.json();
                
                document.getElementById('list-ui').style.display = 'none';
                document.getElementById('detail-view').style.display = 'block';
                
                const contentEl = document.getElementById('detail-content');
                
                // 移除 marked 生成的 HTML 标签间的排版换行符，防止 pre-wrap 将其渲染为空行，导致列表等元素上下空隙过大
                const processedContent = preserveEmptyLines(post.content);
                const parsedBody = marked.parse(processedContent).replace(/>\n\s*</g, '><');
                let html = `<h1>${post.title}</h1><div id="post-body">${parsedBody}</div>`;
                
                if (post.appendix) {
                    let align = 'left';
                    if (post.appendix.align === 'right') align = 'right';
                    if (post.appendix.align === 'center') align = 'center';
                    
                    const processedAppendix = preserveEmptyLines(post.appendix.content);
                    const parsedAppendix = marked.parse(processedAppendix).replace(/>\n\s*</g, '><');
                    html += `<div style="margin-top: 50px; text-align: ${align}; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 45px; opacity: 0.6; font-size: 0.9em;" class="markdown-body appendix-box">${parsedAppendix}</div>`;
                }

                contentEl.innerHTML = html;

                setTimeout(() => {
                    document.querySelectorAll('#post-body pre').forEach(pre => {
                        const code = pre.querySelector('code');
                        if (code) {
                            hljs.highlightElement(code); 
                            if (!pre.querySelector('.copy-btn')) {
                                const btn = document.createElement('button');
                                btn.className = 'copy-btn';
                                btn.innerText = 'Copy';
                                pre.appendChild(btn);
                                btn.onclick = () => {
                                    navigator.clipboard.writeText(code.innerText).then(() => {
                                        btn.innerText = 'Copied!';
                                        setTimeout(() => btn.innerText = 'Copy', 2000);
                                    });
                                };
                            }
                        }
                    });
                }, 50);

                window.scrollTo(0,0);
                if (pushState) history.pushState({id}, '', `?id=${id}`);
            } catch (e) { console.error("Load article error:", e); }
        }

        function showList(pushState = true) {
            document.getElementById('list-ui').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            if (pushState) history.pushState({}, '', window.location.pathname);
            fetchPosts(); 
            runTypewriter();
        }

        window.onpopstate = (e) => {
            const id = new URLSearchParams(window.location.search).get('id');
            id ? loadArticle(id, false) : showList(false);
        };

        document.getElementById('final-back-link').onclick = (e) => {
            e.preventDefault();
            showList();
        };

        window.onload = () => {
            initScene();
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                loadArticle(id, false);
            } else {
                runTypewriter();
                fetchPosts();
            }
        };
    </script>
</body>
</html>
